# ============================================================
# Drone-to-BIM Semantic Segmentation Pipeline Configuration
# ============================================================
# Edit these paths and parameters for your specific project.
# All pipeline stages read from this config.

# ============================================================
# Dataset
# ============================================================
dataset:
  name: "PFTdrone"                          # Project name
  path: "/path/to/your/dataset"       # Path to drone images
  has_gps: true                             # Do images have GPS data?

# ============================================================
# COLMAP
# ============================================================
colmap:
  conda_env: "ColmapLnx"

# ============================================================
# GARField + Gaussian Splatting
# ============================================================
garfield:
  conda_env: "nerfstudio3"
  # Config paths are auto-detected from outputs/*/garfield/*/config.yml
  # and outputs/*/garfield-gauss/*/config.yml after training
  crop_center: [0.02, -0.05, -0.15]
  crop_scale: [1.0, 0.91, 0.19]

# ============================================================
# Orthographic Projection
# ============================================================
projection:
  pointcloud: "exports/garfield_pc/point_cloud.ply"
  scale: 0.05
  output_dir: "outputs/ortho_projection_s005"

  # Facade (side) views: horizontal cameras looking straight at the building.
  n_side: 4               # azimuth steps; 4 = the four facades, 8/12 adds corners
  side_elevations: [0.0]  # degrees; 0 = horizontal. Add e.g. 20 for a second ring
  azimuth_offset: 0.0     # rotate all azimuths to line up with the real facades

  # Roof views
  n_top_ring: 4           # steep views around the roof (plus one true top-down)
  top_elevations: [80.0]

  dist_factor: 1.5        # image plane distance / crop box half-diagonal
  resolution: 1080        # pixels on the long side of each view

# ============================================================
# Clustering
# ============================================================
clustering:
  n_trials: 40
  sample_size: 50000

  # Optuna rejects any trial outside this cluster count.
  # Keep it high to favour fine / oversegmented clusters, which the
  # merging stage can then join back together.
  optimization_min_clusters: 50
  optimization_max_clusters: 120

# ============================================================
# Labeling Views
# ============================================================
labeling_views:
  output_dir: "outputs/labeling_views"

  # Rings of cameras around the building, one entry per elevation level.
  rings:
    - {elevation: 5,  n_azimuth: 16}
    - {elevation: 20, n_azimuth: 16}
    - {elevation: 40, n_azimuth: 12}
    - {elevation: 60, n_azimuth: 8}

  n_top: 1                # top-down views
  top_elevation: 89       # degrees
  azimuth_offset: 0.0     # rotate all rings

  radius_factor: 1.15     # margin around the building in the image
  # building_radius: 0.7  # uncomment to force a fixed camera distance

# ============================================================
# SAM 3 Inference
# ============================================================
sam3:
  conda_env: "sam3"                                             # local env name
  hpc_conda_env: "/path/to/your/hpc/conda_envs/sam3"               # HPC env path
  checkpoint: "/path/to/your/sam3/checkpoint.pt"
  bpe_path: "/path/to/your/sam3/assets/bpe_simple_vocab_16e6.txt.gz"
  confidence_threshold: 0.3
  prompts:
    - "window"
    - "wall"
    - "roof"
    - "door"
    - "column"
    - "beam"
    - "ceiling"
    - "floor"
    - "curtain wall"
    - "opening"
    - "vegetation"
    - "ground"
    - "sky"
    - "staircase"
    - "railing"

# ============================================================
# HPC
# ============================================================
hpc:
  user: "your_hpc_username"
  host: "your.hpc.hostname"
  work_dir: "/path/to/your/hpc/workdir"
  account: "your_hpc_account"
  partition: "gpu"

# ============================================================
# Cluster merging
# ============================================================
merging:
  output_dir: "outputs/merged_clusters"
  sam_cache: "/path/to/your/dataset/sam_cache"
  min_cluster_fraction: 0.50
  min_support: 50
  min_cosine: 0.90

  # Only training cameras that face a facade are used as merge evidence.
  max_elevation_deg: 35     # 0 = horizontal side view, 90 = straight down
  max_incidence_deg: 30     # angle to the nearest facade normal
  facade_azimuths: [0, 90, 180, 270]
  max_offaxis_deg: 40       # camera must point near the building centre

# ============================================================
# Matching
# ============================================================
matching:
  features_dir: "outputs/ortho_projection_cropped"
  labels_npy: "outputs/ortho_projection_cropped/cluster_labels.npy"
  min_iou: 0.05
  output_dir: "outputs/semantic_labels_finetuned"

# ============================================================
# SAM 3 Fine-tuning
# ============================================================
sam3_finetune:
  hdb_dataset: "/path/to/your/HDB_COCO"
  epochs: 30
  gpus: 4
  batch_size: 1
  checkpoint_freq: 5
  output_dir: "/path/to/your/sam3_finetune_output"
